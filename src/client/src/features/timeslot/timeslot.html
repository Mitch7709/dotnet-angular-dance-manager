<div class="flex flex-col w-full">
  <div class="flex justify-between items-center overflow-x-auto">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Start Time</th>
          <th>Duration (min)</th>
          <th>Day</th>
          <th>Active</th>
        </tr>
      </thead>
      <tbody>
        @for (slot of timeSlots(); track slot.id) {
          <tr>
            <td>{{ slot.id }}</td>
            <td>{{ slot.startTime }}</td>
            <td>{{ slot.durationInMinutes }}</td>
            <td>{{ slot.dayOfWeek }}</td>
            <td>{{ slot.isActive ? 'Yes' : 'No' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
