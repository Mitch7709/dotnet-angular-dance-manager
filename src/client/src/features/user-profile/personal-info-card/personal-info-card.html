<div class="card bg-base-100 border border-base-300 shadow-sm">
  <div class="card-body">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="green"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
            />
          </svg>
        </div>

        <div>
          <h2 class="card-title text-lg">Personal Information</h2>
        </div>
      </div>

      <button class="btn btn-sm btn-outline btn-primary" (click)="toggleEditMode()">Edit</button>
    </div>

    <div class="divider my-2"></div>

    @if (editStudent; as form) {
      <div class="grid gap-5 md:grid-cols-2 w-3.5/4">
        <label class="text-md uppercase tracking-wide text-base-content/60">First Name</label>
        <input
          type="text"
          class="font-medium"
          [class.border-1]="isEditMode"
          [(ngModel)]="form.firstName"
          [readonly]="!isEditMode"
        />

        <label class="text-md uppercase tracking-wide text-base-content/60">Last Name</label>
        <input
          type="text"
          class="font-medium"
          [class.border-1]="isEditMode"
          [(ngModel)]="form.lastName"
          [readonly]="!isEditMode"
        />

        <label class="text-md uppercase tracking-wide text-base-content/60">Email</label>
        <input
          type="email"
          class="font-medium"
          [class.border-1]="isEditMode"
          [(ngModel)]="form.email"
          [readonly]="!isEditMode"
        />

        <label class="text-md uppercase tracking-wide text-base-content/60">Phone Number</label>
        <input
          type="tel"
          class="font-medium"
          [class.border-1]="isEditMode"
          [(ngModel)]="form.phoneNumber"
          [readonly]="!isEditMode"
        />

        <label class="text-md uppercase tracking-wide text-base-content/60">Date of Birth</label>
        <input
          type="date"
          class="font-medium"
          [class.border-1]="isEditMode"
          [(ngModel)]="form.dateOfBirth"
          [readonly]="!isEditMode"
        />

        <label class="text-md uppercase tracking-wide text-base-content/60">Bio</label>
        <textarea
          class="font-medium"
          [class.border-1]="isEditMode"
          [(ngModel)]="form.bio"
          [readonly]="!isEditMode"
        ></textarea>
      </div>
    }

    @if (isEditMode) {
      <div class="flex justify-end mt-4">
        <button class="btn btn-primary" (click)="saveChanges()">Save</button>
        <button class="btn btn-outline btn-error ml-2" (click)="cancelEdit()">Cancel</button>
      </div>
    }
  </div>
</div>
