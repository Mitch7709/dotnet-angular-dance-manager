<div class="card bg-base-100 border border-base-300 shadow-sm">
  <div class="card-body">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="green"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
            />
          </svg>
        </div>

        <div>
          <h2 class="card-title text-lg">Personal Information</h2>
        </div>
      </div>

      <button class="btn btn-sm btn-outline btn-primary">Edit</button>
    </div>

    <div class="divider my-2"></div>

    <div class="grid gap-5 md:grid-cols-2">
      <label class="text-md uppercase tracking-wide text-base-content/60">First Name</label>
      <p class="font-medium">{{ firstName }}</p>

      <label class="text-md uppercase tracking-wide text-base-content/60">Last Name</label>
      <p class="font-medium">{{ lastName }}</p>

      <label class="text-md uppercase tracking-wide text-base-content/60">Email</label>
      <p class="font-medium">{{ userService.currentUser()?.email }}</p>
    </div>
  </div>
</div>
