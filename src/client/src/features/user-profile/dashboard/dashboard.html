<div class="mb-8">
  <h1 class="text-4xl font-bold">My Profile</h1>
  <p class="text-base-content/70 mt-2">View and manage your personal information</p>
</div>

<div class="grid gap-6 lg:grid-cols-3">
  <app-profile-header class="lg:col-span-2" [user]="user"></app-profile-header>

  <app-quick-links></app-quick-links>
</div>

<div class="grid gap-6 md:grid-cols-2 mt-10">
  <app-personal-info-card
    [userInfo]="personalInfo()"
    (userUpdated)="userUpdated($event)"
  ></app-personal-info-card>

  @if (user?.roles?.includes('Student')) {
    <app-waiver-card [studentInfo]="studentInfo()"></app-waiver-card>
  }
  @else if (user?.roles?.includes('Instructor')) {
    <app-qualified-classes [qualifiedClasses]="instructorInfo()?.qualifiedClasses || []"></app-qualified-classes>
  }
</div>
