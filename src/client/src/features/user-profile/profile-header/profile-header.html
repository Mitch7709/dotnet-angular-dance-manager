<div class="card bg-base-100 border border-base-300 shadow">
  @if (user)
  {
  <div class="card-body">
    <div class="flex flex-col md:flex-row items-center gap-6">
      <!-- Avatar -->
      <div class="avatar">
        <div class="w-42.5 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
          <img [src]="user.imageUrl || '/user.png'" alt="Profile Photo" />
        </div>
      </div>

      <!-- Information -->
      <div class="flex-1">
        <h2 class="text-3xl font-bold">{{ user.displayName }}</h2>

        @for (role of user.roles; track role)
        {
          <div class="badge badge-primary mt-2">{{ role }}</div>
        }

        <div class="grid md:grid-cols-1 gap-y-2 mt-6 text-sm">
